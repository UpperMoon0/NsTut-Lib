allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every supported Minecraft/loader target.'
    dependsOn ':forge-1.20.1:build', ':neoforge-1.21.1:build', ':neoforge-26.1.2:build'
}

tasks.register('testAllVersions') {
    group = 'verification'
    dependsOn ':forge-1.20.1:test', ':neoforge-1.21.1:test', ':neoforge-26.1.2:test'
}

tasks.register('publishAllToMavenLocal') {
    group = 'publishing'
    dependsOn ':forge-1.20.1:publishToMavenLocal', ':neoforge-1.21.1:publishToMavenLocal', ':neoforge-26.1.2:publishToMavenLocal'
}
