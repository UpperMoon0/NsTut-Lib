name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft-fast:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    name: draft-fast-neoforge-26.1.2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Fast unit tests and build
        run: ./gradlew :neoforge-26.1.2:test :neoforge-26.1.2:build --no-daemon --stacktrace

  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: forge-1.20.1
            java: '17'
          - target: neoforge-1.21.1
            java: '21'
          - target: neoforge-26.1.2
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Unit tests and build
        run: ./gradlew :${{ matrix.target }}:test :${{ matrix.target }}:build --no-daemon --stacktrace
      - name: Forge transaction GameTests
        if: matrix.target == 'forge-1.20.1'
        run: ./gradlew :forge-1.20.1:runGameTestServer --no-daemon --stacktrace
