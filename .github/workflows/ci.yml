name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: forge-1.20.1
            java: '17'
          - target: neoforge-1.21.1
            java: '21'
          - target: neoforge-26.1.2
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Unit tests and build
        if: matrix.target != 'forge-1.20.1'
        run: ./gradlew :${{ matrix.target }}:test :${{ matrix.target }}:build --no-daemon --stacktrace
      - name: Forge build
        if: matrix.target == 'forge-1.20.1'
        run: ./gradlew :forge-1.20.1:build -x :forge-1.20.1:test --no-daemon --stacktrace
      - name: Forge transaction GameTests
        if: matrix.target == 'forge-1.20.1'
        run: ./gradlew :forge-1.20.1:runGameTestServer --no-daemon --stacktrace
